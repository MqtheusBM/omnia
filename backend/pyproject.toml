[project]
name = "omnia-backend"
version = "0.1.0"
description = "Serviço de análise de processos judiciais com Document AI + Gemini Flash"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "google-cloud-documentai>=2.29.0",
    "google-genai>=1.0.0",
    "openai>=2.0.0",
    "google-cloud-storage>=2.18.0",
    "pymongo>=4.8.0",
    "motor>=3.5.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
